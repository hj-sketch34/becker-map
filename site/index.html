<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Senator Josh Becker — What He's Done for District 13</title>

  <!-- Leaflet: the free map library. Loaded from its official CDN. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e5e7eb;
      --accent: #1d4ed8;
      --map-bg: #e9eef1;                 /* matches the light basemap so tile gaps don't flash gray */
      --shadow: 0 1px 3px rgba(15,23,42,.09), 0 1px 2px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* --- header --- */
    header { padding: 15px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
    header .mark { width: 6px; align-self: stretch; border-radius: 3px; background: linear-gradient(180deg, var(--accent), #3949ab); }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; }
    header p { margin: 3px 0 0; color: var(--muted); font-size: .86rem; }

    /* --- layout --- */
    .layout { display: flex; height: calc(100vh - 74px); }
    #map { flex: 1; background: var(--map-bg); }
    .leaflet-container { background: var(--map-bg); font-family: inherit; }

    aside { width: 312px; border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 16px; background: #fafbfc; }
    aside h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
    .hint { font-size: .74rem; color: var(--muted); margin: 0 0 10px; }

    /* --- legend (also a filter: click a row to show/hide that category) --- */
    .legend-row {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 6px 8px; margin: 2px 0; border: 0; border-radius: 8px;
      background: transparent; font: inherit; font-size: .9rem; color: var(--ink);
      cursor: pointer; text-align: left; transition: background .12s;
    }
    .legend-row:hover { background: #eef2f7; }
    .legend-badge { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; box-shadow: var(--shadow); }
    .legend-badge svg { width: 14px; height: 14px; }
    .legend-label { text-transform: capitalize; }
    .legend-row.off { opacity: .4; }
    .legend-row.off .legend-label { text-decoration: line-through; }

    /* --- statewide list --- */
    .statewide-item { padding: 11px 2px; border-top: 1px solid var(--line); font-size: .86rem; line-height: 1.4; }
    .statewide-item a { color: var(--accent); text-decoration: none; }
    #statewide-empty { color: var(--muted); font-size: .85rem; }

    /* --- pin markers: a colored badge with a white category icon --- */
    .pin-marker { background: transparent; border: 0; }
    .pin-badge {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--c); color: #fff; border: 2.5px solid #fff;
      box-shadow: 0 2px 5px rgba(15,23,42,.35);
      display: grid; place-items: center; transition: transform .12s;
    }
    .pin-badge svg { width: 16px; height: 16px; }
    .pin-marker:hover .pin-badge { transform: scale(1.18); z-index: 1000; }

    /* --- popup card --- */
    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 6px 24px rgba(15,23,42,.16); }
    .leaflet-popup-content { margin: 14px 16px; }
    .pop-title { font-weight: 650; font-size: .98rem; line-height: 1.3; margin-bottom: 6px; }
    .pop-meta { font-size: .76rem; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pop-summary { font-size: .88rem; line-height: 1.5; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; color: #fff; font-size: .7rem; font-weight: 600; text-transform: capitalize; }
    .badge svg { width: 11px; height: 11px; }
    .pop-source { display: inline-flex; align-items: center; gap: 5px; margin-top: 12px; padding: 7px 12px; background: var(--accent); color: #fff; border-radius: 8px; font-size: .8rem; font-weight: 600; text-decoration: none; }
    .pop-source:hover { background: #1743b8; }

    /* --- the "outside the district" caption --- */
    .mask-note { background: rgba(255,255,255,.94); padding: 6px 11px; border-radius: 8px; box-shadow: var(--shadow);
      font-size: .78rem; color: var(--ink); display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); }
    .mask-swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; background: #334155; opacity: .45; }

    /* --- small screens: stack the sidebar under the map --- */
    @media (max-width: 720px) {
      .layout { flex-direction: column; height: auto; }
      #map { height: 62vh; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div class="mark"></div>
    <div>
      <h1>Senator Josh Becker — What He's Done for District 13</h1>
      <p>A map of funded, sourced accomplishments. Every pin links to the official announcement. Click a pin for the story.</p>
    </div>
  </header>

  <div class="layout">
    <div id="map"></div>
    <aside>
      <h2>Categories</h2>
      <p class="hint">Click a category to show or hide its pins.</p>
      <div id="legend"></div>

      <h2 style="margin-top:22px;">Statewide work</h2>
      <div id="statewide"></div>
    </aside>
  </div>

  <script src="map.js"></script>
</body>
</html>
