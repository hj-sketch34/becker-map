<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Senator Josh Becker — What He's Done for District 13</title>

  <!-- Leaflet: the free map library. Loaded from its official CDN. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root { --ink: #1a1a1a; --muted: #666; --line: #e2e2e2; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); }

    header { padding: 18px 22px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

    .layout { display: flex; height: calc(100vh - 82px); }
    #map { flex: 1; }
    aside { width: 300px; border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
    aside h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }

    .legend-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: .9rem; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }

    .statewide-item { padding: 10px 0; border-top: 1px solid var(--line); font-size: .88rem; }
    .statewide-item a { color: #1565c0; text-decoration: none; }
    #statewide-empty { color: var(--muted); font-size: .85rem; }

    /* Popup styling */
    .pop-title { font-weight: 600; margin-bottom: 4px; }
    .pop-meta { font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
    .pop-summary { font-size: .88rem; line-height: 1.4; }
    .pop-source { display: inline-block; margin-top: 8px; font-size: .82rem; color: #1565c0; text-decoration: none; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff; font-size: .72rem; text-transform: capitalize; }

    /* Caption box on the map explaining the gray mask */
    .mask-note { background: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: .8rem; color: var(--ink);
      display: flex; align-items: center; gap: 7px; }
    .mask-swatch { width: 14px; height: 14px; border-radius: 3px; flex: none;
      background: #3a3a3a; opacity: .6; }
  </style>
</head>
<body>
  <header>
    <h1>Senator Josh Becker — What He's Done for District 13</h1>
    <p>A map of funded, sourced accomplishments. Every pin links to the official announcement. Click a pin for the story.</p>
  </header>

  <div class="layout">
    <div id="map"></div>
    <aside>
      <h2>Categories</h2>
      <div id="legend"></div>

      <h2 style="margin-top:22px;">Statewide work</h2>
      <div id="statewide"></div>
    </aside>
  </div>

  <script src="map.js"></script>
</body>
</html>
